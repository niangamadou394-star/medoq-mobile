name: medoq
description: Medoq - Trouvez vos médicaments près de vous
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.4.0
  riverpod_annotation: ^2.3.0

  # Navigation
  go_router: ^13.0.0

  # HTTP client
  dio: ^5.4.0

  # Secure storage
  flutter_secure_storage: ^9.0.0

  # Maps
  google_maps_flutter: ^2.6.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # Location
  geolocator: ^11.0.0

  # Firebase
  firebase_core: ^3.0.0
  firebase_messaging: ^15.0.0

  # Notifications
  flutter_local_notifications: ^17.0.0

  # Image caching
  cached_network_image: ^3.3.0

  # Shimmer
  shimmer: ^3.0.0

  # Internationalization
  intl: ^0.19.0

  # Preferences
  shared_preferences: ^2.2.0

  # Connectivity
  connectivity_plus: ^6.0.0

  # URL Launcher
  url_launcher: ^6.2.0

  # SVG
  flutter_svg: ^2.0.9

  # Lottie animations
  lottie: ^3.0.0

  # OTP input
  pin_code_fields: ^8.0.1

  # Fonts
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  riverpod_generator: ^2.3.0
  custom_lint: ^0.6.0
  riverpod_lint: ^2.3.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  # fonts loaded via google_fonts package at runtime
